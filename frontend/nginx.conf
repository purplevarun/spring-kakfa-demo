server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;

    set $order_service http://order-service:4003;
    set $inventory_service http://inventory-service:4001;
    set $notification_service http://notification-service:4002;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header X-Content-Type-Options nosniff;

    location /api/order/ {
        rewrite ^/api/order/(.*)$ /$1 break;
        proxy_pass $order_service;
    }

    location /api/inventory/ {
        rewrite ^/api/inventory/(.*)$ /$1 break;
        proxy_pass $inventory_service;
    }

    location /api/notification/ {
        rewrite ^/api/notification/(.*)$ /$1 break;
        proxy_pass $notification_service;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}